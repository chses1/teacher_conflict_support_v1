services:
  - type: web
    name: teacher-conflict-support-v1
    runtime: node
    plan: free
    buildCommand: npm install && npm run write:firebase-config
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MEASUREMENT_ID
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: apps.chses.tyc.edu.tw
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: CORS_ALLOWED_ORIGIN
        value: "*"
